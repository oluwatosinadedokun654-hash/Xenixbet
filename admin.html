<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENIXbet - Secure Multi-Campus Admin Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-center items-center p-4">

    <!-- AUTH GATEWAY -->
    <div id="auth-screen" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <span class="bg-red-500/10 text-red-400 border border-red-500/20 text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-widest">Restricted Access</span>
            <h1 class="text-2xl font-black text-cyan-400 tracking-wider uppercase mt-3">Admin Gateway</h1>
            <p class="text-xs text-slate-400 mt-1">Verify institutional clearance to proceed</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <!-- School Target -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target University</label>
                <select id="admin-school-select" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                    <option value="" disabled selected>Select Institution</option>
                    <option value="LASU">Lagos State University (LASU)</option>
                    <option value="UNILAG">University of Lagos (UNILAG)</option>
                    <option value="UI">University of Ibadan (UI)</option>
                    <option value="OAU">Obafemi Awolowo University (OAU)</option>
                    <option value="OOU">Olabisi Onabanjo University (OOU)</option>
                    <option value="ABUAD">Afe Babalola University (ABUAD)</option>
                </select>
            </div>

            <!-- Admin Username -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Admin Username</label>
                <input type="text" id="admin-username" placeholder="e.g. tosin_admin" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Access Key</label>
                <input type="password" id="admin-pass" placeholder="Enter Password" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg transition uppercase tracking-wider text-sm">
                Authenticate Session
            </button>
            <p id="auth-error" class="text-red-400 text-xs text-center hidden font-medium">Access Denied: Invalid Credentials</p>
        </form>
    </div>

    <!-- MAIN ADMIN DASHBOARD (Hidden by default) -->
    <div id="admin-dashboard" class="hidden w-full max-w-4xl min-h-screen flex flex-col py-6">
        <header class="bg-slate-900 border border-slate-800 px-6 py-4 rounded-2xl flex items-center justify-between mb-6">
            <div class="flex items-center space-x-3">
                <span class="bg-cyan-500 text-slate-950 font-black text-xs px-2.5 py-1 rounded uppercase">Active Admin</span>
                <div>
                    <h2 class="font-bold text-sm text-slate-200" id="logged-admin-display">Admin</h2>
                    <p class="text-[10px] text-cyan-400 font-mono uppercase" id="logged-school-display">LASU</p>
                </div>
            </div>
            <button id="logout-btn" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-slate-300 transition font-semibold">
                Lock Session
            </button>
        </header>

        <main class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6 flex-1">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 border-b border-slate-800 pb-3">
                Campus Configuration Management
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Custom Logo URL</label>
                    <input type="url" id="logo-url-input" placeholder="https://example.com/logo.png" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Campus Title Override</label>
                    <input type="text" id="campus-title-input" placeholder="e.g. LASU Champions League" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Live Announcement Broadcast</label>
                <textarea id="announcement-input" rows="3" placeholder="Broadcast match updates..."
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500"></textarea>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                <span id="save-status" class="text-xs text-emerald-400 font-medium hidden">✓ Changes synchronized successfully</span>
                <button id="save-config-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-3 rounded-lg text-sm transition uppercase tracking-wider">
                    Commit Changes
                </button>
            </div>
        </main>
    </div>

    <script>
        const AUTH_KEY = 'TOAA';
        const CONFIG_KEY = 'XENIXBET_SCHOOL_CONFIGS';

        const authScreen = document.getElementById('auth-screen');
        const adminDashboard = document.getElementById('admin-dashboard');
        const loginForm = document.getElementById('login-form');
        const adminSchoolSelect = document.getElementById('admin-school-select');
        const adminUsername = document.getElementById('admin-username');
        const adminPass = document.getElementById('admin-pass');
        const authError = document.getElementById('auth-error');
        const logoutBtn = document.getElementById('logout-btn');

        const loggedAdminDisplay = document.getElementById('logged-admin-display');
        const loggedSchoolDisplay = document.getElementById('logged-school-display');
        const logoUrlInput = document.getElementById('logo-url-input');
        const campusTitleInput = document.getElementById('campus-title-input');
        const announcementInput = document.getElementById('announcement-input');
        const saveConfigBtn = document.getElementById('save-config-btn');
        const saveStatus = document.getElementById('save-status');

        let currentActiveSchool = '';

        if (sessionStorage.getItem('XENIX_ADMIN_AUTH') === 'true') {
            currentActiveSchool = sessionStorage.getItem('XENIX_ADMIN_SCHOOL') || 'LASU';
            loggedAdminDisplay.textContent = sessionStorage.getItem('XENIX_ADMIN_USER') || 'Admin';
            loggedSchoolDisplay.textContent = currentActiveSchool;
            showDashboard();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (adminPass.value === AUTH_KEY && adminSchoolSelect.value && adminUsername.value.trim() !== '') {
                currentActiveSchool = adminSchoolSelect.value;
                sessionStorage.setItem('XENIX_ADMIN_AUTH', 'true');
                sessionStorage.setItem('XENIX_ADMIN_SCHOOL', currentActiveSchool);
                sessionStorage.setItem('XENIX_ADMIN_USER', adminUsername.value.trim());
                
                loggedAdminDisplay.textContent = adminUsername.value.trim();
                loggedSchoolDisplay.textContent = currentActiveSchool;

                authError.classList.add('hidden');
                showDashboard();
            } else {
                authError.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.clear();
            adminDashboard.classList.add('hidden');
            authScreen.classList.remove('hidden');
            adminPass.value = '';
            adminUsername.value = '';
        });

        function showDashboard() {
            authScreen.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
            loadSchoolConfig(currentActiveSchool);
        }

        function loadSchoolConfig(schoolCode) {
            const configs = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
            const schoolData = configs[schoolCode] || {};
            logoUrlInput.value = schoolData.logoUrl || '';
            campusTitleInput.value = schoolData.title || `${schoolCode} Campus League`;
            announcementInput.value = schoolData.announcement || '';
        }

        saveConfigBtn.addEventListener('click', () => {
            const configs = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
            configs[currentActiveSchool] = {
                logoUrl: logoUrlInput.value,
                title: campusTitleInput.value,
                announcement: announcementInput.value,
                updatedAt: new Date().toISOString()
            };
            localStorage.setItem(CONFIG_KEY, JSON.stringify(configs));
            saveStatus.classList.remove('hidden');
            setTimeout(() => saveStatus.classList.add('hidden'), 3000);
        });
    </script>
</body>
</html>
